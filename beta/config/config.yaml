# ==============================================================================
# 30' FOOTBALL PLUS — ISOLATED BETA PIPELINE CONFIGURATION
# Safe Sandbox Environment for Experimental Development
# Zero Production Impact | Autonomous Execution & Testing
# ==============================================================================

# Pipeline Execution Mode
hot_period: false
daily_limit: 1

# Isolated Beta File System Paths (Relative to BETA_ROOT)
paths:
  data_dir: "data"
  output_dir: "output"
  evidence_dir: "evidence"
  logs_dir: "logs"
  cache_dir: "cache"
  db_path: "data/beta_news.db"
  retention_db: "data/beta_retention.db"

# News Feeds Configuration (Optimized for High-Virality Transfer News)
feeds:
  - name: "Google News Transfers"
    url: "https://news.google.com/rss/search?q=%22football%22+AND+(transfer+OR+transfers+OR+signing+OR+bid+OR+contract)+when:2d&hl=en-GB&gl=GB&ceid=GB:en"
    tier_weight: 1.0
  - name: "Transfermarkt News"
    url: "https://www.transfermarkt.com/rss/news"
    tier_weight: 0.95
  - name: "Football Italia"
    url: "https://football-italia.net/feed/"
    tier_weight: 0.90
  - name: "BBC Sport Football"
    url: "https://feeds.bbci.co.uk/sport/football/rss.xml"
    tier_weight: 1.0
  - name: "Sky Sports News"
    url: "https://www.skysports.com/rss/11095"
    tier_weight: 0.95
  - name: "The Guardian Football"
    url: "https://www.theguardian.com/football/rss"
    tier_weight: 0.95
  - name: "CaughtOffside"
    url: "https://www.caughtoffside.com/feed/"
    tier_weight: 0.85
  - name: "BeSoccer"
    url: "https://www.besoccer.com/news"
    type: "html"
    tier_weight: 0.90
  - name: "ESPN FC"
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/news?limit=25"
    type: "espn_json"
    tier_weight: 0.92
  - name: "ESPN Champions League"
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/news?limit=20"
    type: "espn_json"
    tier_weight: 0.92
  - name: "ESPN Spain & Italy"
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/news?limit=15"
    type: "espn_json"
    tier_weight: 0.88
  - name: "ESPN Serie A"
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/news?limit=15"
    type: "espn_json"
    tier_weight: 0.88
  - name: "ESPN Bundesliga"
    url: "https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/news?limit=15"
    type: "espn_json"
    tier_weight: 0.88
  - name: "Bing News Breaking Football"
    url: "https://www.bing.com/news/search?q=football+(transfer+OR+sacked+OR+signing+OR+contract+OR+injured)+breaking&format=rss"
    type: "bing_news"
    tier_weight: 0.90
  - name: "Fabrizio & Ornstein Wire"
    url: "https://news.google.com/rss/search?q=(%22Fabrizio+Romano%22+OR+%22David+Ornstein%22)+football+when:2d&hl=en-GB&gl=GB&ceid=GB:en"
    tier_weight: 0.98
  - name: "FourFourTwo"
    url: "https://www.fourfourtwo.com/feeds.xml"
    tier_weight: 0.85
  - name: "Reddit r/soccer"
    url: "https://www.reddit.com/r/soccer/hot.json?limit=25"
    type: "reddit"
    tier_weight: 0.88

# Official / League Source Domains
official_domains:
  - "arsenal.com"
  - "chelseafc.com"
  - "liverpoolfc.com"
  - "mancity.com"
  - "manutd.com"
  - "tottenhamhotspur.com"
  - "realmadrid.com"
  - "fcbarcelona.com"
  - "premierleague.com"

# Reliability & Clustering Thresholds
ranking:
  recency_halflife_hours: 12.0
  cluster_similarity_threshold: 0.50
  confirmed_sources_count: 3
  credible_sources_count: 2

# Models and Speech Synthesis
models:
  # Primary Reasoning & Narrative Engine
  llm_primary: "openai/gpt-oss-120b"
  llm_fallback: "qwen/qwen3.8-27b"
  # Shared read-only voice models in repo root
  qwen3_tts_base_path: "../models/qwen3_tts_base"
  martin_tyler_prompt_cache: "../models/martin_tyler_prompt.pt"
  jeff_stelling_prompt_cache: "../models/jeff_stelling_prompt.pt"
  # Fallback Engines
  edge_tts_voice: "en-GB-ThomasNeural"
  kokoro_model_path: "../models/kokoro-v0_19.onnx"
  kokoro_voices_path: "../models/voices.json"

# Visual Sourcing Engine
visual_sourcing:
  backend: "editorial"       # Real press and matchday photo scraping
  min_variance: 15.0         # Reject blank / solid images
  min_laplacian_var: 80.0    # Reject blurry images

# Video Assembly & Retro 90s TV Broadcast
video:
  resolution: [1080, 1920]   # 9:16 Vertical format for Shorts/Reels/TikTok
  fps: 30
  slide_padding_sec: 0.2
  xfade_sec: 0.5
  credit_slide_duration_sec: 1.2
  bg_music_volume_db: -22.0
  enable_crt_scanlines: true
  enable_bezel_logo_bug: true
  render_engine: "remotion"  # "remotion" or "ffmpeg"

# YouTube Upload Policy — STRICT ISOLATION SAFEGUARD
youtube:
  privacy_status: "private"
  allow_public_upload: false # STRICTLY FALSE: Beta pipeline never publishes to production
  category_id: "17"          # Sports
  contains_synthetic_media: true
