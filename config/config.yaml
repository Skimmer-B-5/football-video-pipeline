# Football Transfer News Video Pipeline Configuration

# Pipeline Execution Mode
hot_period: false  # When false, max 1 video/day. When true, up to 3 videos/day.
daily_limit: 1

# Feeds Configuration
feeds:
  - name: "BBC Sport Football"
    url: "https://feeds.bbci.co.uk/sport/football/rss.xml"
    tier_weight: 1.0
  - name: "Sky Sports Transfer Centre"
    url: "https://www.skysports.com/rss/12040"
    tier_weight: 0.95
  - name: "The Guardian Football"
    url: "https://www.theguardian.com/football/rss"
    tier_weight: 0.95
  - name: "BeSoccer"
    url: "https://www.besoccer.com/news"
    type: "html"
    tier_weight: 0.95
  - name: "TransferMarketWeb"
    url: "https://www.transfermarketweb.com/rss"
    tier_weight: 0.95
  - name: "ESPN FC"
    url: "https://www.espn.com/espn/rss/football/news"
    tier_weight: 0.90

# Official / League Source Domains (for automatic "confirmed" tier)
official_domains:
  - "arsenal.com"
  - "chelseafc.com"
  - "liverpoolfc.com"
  - "mancity.com"
  - "manutd.com"
  - "tottenhamhotspur.com"
  - "realmadrid.com"
  - "fcbarcelona.com"
  - "premierleague.com"

# Reliability & Clustering Thresholds
ranking:
  recency_halflife_hours: 12.0
  cluster_similarity_threshold: 0.65
  confirmed_sources_count: 3
  credible_sources_count: 2

# Models and Speech Synthesis
models:
  # Primary Reasoning & Narrative Engine
  llm_primary: "openai/gpt-oss-120b"
  llm_fallback: "qwen/qwen3.8-27b"
  # Martin Tyler Voice Cloning (Qwen3-TTS 0.6B Base)
  qwen3_tts_base_path: "models/qwen3_tts_base"
  martin_tyler_prompt_cache: "models/martin_tyler_prompt.pt"
  # Fallback Engines
  edge_tts_voice: "en-GB-ThomasNeural"
  kokoro_model_path: "models/kokoro-v0_19.onnx"
  kokoro_voices_path: "models/voices.json"

# Visual Sourcing Engine
visual_sourcing:
  backend: "editorial"       # Real press and matchday photo scraping
  min_variance: 15.0         # Reject blank / solid images
  min_laplacian_var: 80.0    # Reject blurry images

# Video Assembly & Retro 90s TV Broadcast
video:
  resolution: [1080, 1920]   # 9:16 Vertical format for Shorts/Reels/TikTok
  fps: 30
  slide_padding_sec: 0.2
  xfade_sec: 0.5
  credit_slide_duration_sec: 2.0
  bg_music_volume_db: -22.0
  enable_crt_scanlines: true
  enable_bezel_logo_bug: true

# YouTube Upload Policy
youtube:
  privacy_status: "private"  # Always private by default
  allow_public_upload: false # Set true ONLY if public publishing is desired upon Telegram approval
  category_id: "17"          # Sports
  contains_synthetic_media: true
